---
- name: Deploy Nutritrack Application via Docker Compose
  hosts: localhost
  gather_facts: yes
  become: no

  tasks:  # ◄ Defined ONLY ONCE at the top of your execution list
    - name: Ensure Docker and dependencies are installed
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - rsync
        state: present
        update_cache: yes

    - name: Ensure the permanent application folder exists
      ansible.builtin.file:
        path: /opt/nutritrack
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Synchronize repository context (excluding heavy virtual environment files)
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../"
        dest: /var/jenkins_home/workspace/ultibranch_feature_ansible-fresh/../../../../../opt/nutritrack/ # Resolves local relative workspace paths cleanly
        delete: yes  # Automatically cleans up deleted files from the target directory
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.venv"
          - "--exclude=env"
          - "--exclude=__pycache__"
          - "--exclude=.pytest_cache"

    - name: Pull latest images and spin up the Docker Compose container network
      community.docker.docker_compose_v2:
        project_src: /opt/nutritrack
        state: present
        pull: always
        recreate: always   # ◄ Forces Docker to shift containers from "Created" to "Running"