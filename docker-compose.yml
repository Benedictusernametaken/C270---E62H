version: '3.8'

services:
  # --- PRESENTATION TIER (FRONTEND) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nutritrack-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  # --- LOGIC TIER (BACKEND) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutritrack-backend
    environment:
      - FLASK_APP=app.main
      - PYTHONPATH=/app
      - FLASK_ENV=development
      # --- UPDATED LINE TO MATCH THE DATABASE TIERS CREDS ---
      - DATABASE_URL=postgresql://nutri_admin:nutri_password@database:5432/nutritrack_db
    ports:
      - "5000:5000"
    depends_on:
      - database

  # --- DATA TIER (DATABASE) ---
  database:
    image: postgres:15-alpine
    container_name: nutritrack-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nutri_admin
      - POSTGRES_PASSWORD=nutri_password
      - POSTGRES_DB=nutritrack_db
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

 # --- AUTOMATION SERVER (CI/CD) ---
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: nutritrack-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # --- ADD THESE TWO LINES TO SHARE YOUR HOST'S DOCKER CLI ENGINE PERMANENTLY ---
      - /usr/bin/docker:/usr/bin/docker
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/local/lib/docker/cli-plugins/docker-compose

# ==============================
# GLOBAL VOLUMES CONFIGURATION 
# ==============================
volumes:
  postgres_data:
  jenkins_data: